<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于我</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --text: #24292f;
      --muted: #57606a;
      --link: #0969da;
      --border: #d0d7de;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .links a {
      color: var(--link);
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 14px;
      background: #fff;
      transition: 0.2s;
    }

    .links a:hover {
      background: var(--link);
      color: #fff;
      border-color: var(--link);
    }

    .copy-box {
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }

    .copy-box input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }

    .copy-box button {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--link);
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .copy-box button:hover {
      background: var(--link);
      color: #fff;
      border-color: var(--link);
    }

    .back {
      display: inline-block;
      margin-top: 24px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover { color: var(--link); }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>关于我</h1>

      <div class="links">
        <a href="https://steamcommunity.com/id/ImAtTheCentreOfEverything/" target="_blank" rel="noopener">Steam</a>
      </div>

      <div class="copy-box">
        <input id="copyText" value="2896852839" readonly>
        <button onclick="copyText()">QQ:2896852839</button>
      </div>

      <a class="back" href="index.html">← 返回首页</a>
    </div>
  </div>

  <script>
    function copyText() {
      const input = document.getElementById('copyText');
      input.select();
      navigator.clipboard.writeText(input.value).then(() => {
        const btn = event.target;
        btn.textContent = '已复制';
        setTimeout(() => btn.textContent = '复制', 1500);
      });
    }
  </script>
</body>
</html>
